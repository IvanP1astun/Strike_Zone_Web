{% load static %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
  <div class="container">
    <a class="navbar-brand" href="{% url 'home' %}">
      <i class="bi bi-crosshair me-2"></i>StrikeZone
    </a>
    
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'home' %}">
            <i class="bi bi-house me-1"></i>Главная
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'catalog' %}">
            <i class="bi bi-grid me-1"></i>Каталог
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'about' %}">
            <i class="bi bi-info-circle me-1"></i>О нас
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'rules' %}">
            <i class="bi bi-file-text me-1"></i>Правила
          </a>
        </li>
      </ul>
      
      <ul class="navbar-nav">
        {% if user.is_authenticated %}
          <!-- Пользователь авторизован -->
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
              <i class="bi bi-person-circle me-1"></i>
              {{ user.get_short_name|default:user.username }}
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li>
                <a class="dropdown-item" href="{% url 'profile' %}">
                  <i class="bi bi-person me-2"></i>Личный кабинет
                </a>
              </li>
              <li>
                <a class="dropdown-item" href="{% url 'profile' %}">
                  <i class="bi bi-calendar-check me-2"></i>Мои регистрации
                </a>
              </li>
              <li><hr class="dropdown-divider"></li>
              <li>
                <form method="post" action="{% url 'logout' %}">
                  {% csrf_token %}
                  <button type="submit" class="dropdown-item text-danger">
                    <i class="bi bi-box-arrow-right me-2"></i>Выйти
                  </button>
                </form>
              </li>
            </ul>
          </li>
        {% else %}
          <!-- Пользователь не авторизован -->
          <li class="nav-item">
            <a class="nav-link" href="{% url 'login' %}">
              <i class="bi bi-box-arrow-in-right me-1"></i>Войти
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'register' %}">
              <i class="bi bi-person-plus me-1"></i>Регистрация
            </a>
          </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
