{% extends "base.html" %}
{% load i18n %}
{% load django_bootstrap5 %}
{% block content %}
  <div class="col d-flex justify-content-center">
    <div class="card col-4 m-3">
      <div class="card-header">
        {% translate "Поменять пароль" %}
      </div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          {% bootstrap_form form %}
          {% translate "Поменять пароль" as submit_label %}{% bootstrap_button button_type="submit" content=submit_label %}
        </form>
      </div>
    </div>
  </div>
{% endblock %}
