name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest

    env:
      # Эти переменные нужны, чтобы settings.py не падал на CI-машине,
      # где нет .env файла. Значения тестовые, не используются в проде.
      DEBUG: "False"
      SECRET_KEY: "ci-test-secret-key-not-used-in-production"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      LOG_DIR: "/tmp/django-logs"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        run: pytest --cov=main --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

# ---------------------------------------------------------------------------
# Если в будущем поправите баг с задвоенным DATABASES в settings.py
# (см. разбор проекта) и приложение реально начнёт использовать Postgres —
